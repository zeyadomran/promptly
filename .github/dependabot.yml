version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Toronto
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /
    # TypeScript ESLint currently supports TS 6; retain the approved compiler line.
    ignore:
      - dependency-name: typescript
        versions: ['>=7']
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: America/Toronto
    open-pull-requests-limit: 5
    groups:
      electron-forge:
        patterns: ['@electron-forge/*']
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      tailwind:
        patterns: ['tailwindcss', '@tailwindcss/*']
    commit-message:
      prefix: build
