name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-validation:
    name: Workflow validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  foundation-smoke:
    name: Foundation smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Check application foundation
        run: npm run check
      - name: Install fixture browser
        run: npx playwright install chromium
      - name: Verify design primitives, themes and keyboard behavior
        run: npm run test:design
      - name: Verify packaged Radix and Sonner under production CSP
        run: npm run test:packaged-design
      - name: Package application
        run: npm run package
      - name: Verify packaged shell and platform native fixtures
        id: packaged-smoke
        run: npm run test:smoke
      - name: Save full-path search benchmark evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: search-benchmark-${{ matrix.os }}
          path: |
            test-results/**/search-benchmark.json
            test-results/**/visible-common-query.png
          if-no-files-found: ignore
      - name: Diagnose failed search gate without replacing ordinary evidence
        if: failure() && steps.packaged-smoke.conclusion == 'failure'
        timeout-minutes: 3
        env:
          PROMPTLY_SEARCH_TRACE: '1'
        run: npx playwright test tests/e2e/search.spec.ts --output="${{ runner.temp }}/promptly-search-trace"
      - name: Retain nonqualifying bounded search trace
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: search-diagnostic-${{ matrix.os }}
          path: ${{ runner.temp }}/promptly-search-trace/
          if-no-files-found: ignore
          retention-days: 7
      - name: Retain controlled fixture results and diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fixture-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
