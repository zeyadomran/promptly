name: Native feasibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-helper:
    name: Native helper (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.23.2'
      - name: Compile Windows helper with OS framework compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./experiments/native-capture/build-windows.ps1
      - name: Compile macOS helper without signing
        if: runner.os == 'macOS'
        run: sh experiments/native-capture/build-macos.sh
      - name: Verify protocol and controlled fixture selection
        run: node experiments/native-capture/protocol-check.mjs --fixtures
      - name: Verify strict options and escaped synthetic payload boundaries
        run: node experiments/native-capture/protocol-safety-check.mjs
