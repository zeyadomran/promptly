name: Signed Windows release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish this stable version tag after signing (false validates only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: signed-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and verify
    runs-on: windows-latest
    environment: release
    timeout-minutes: 35
    permissions:
      contents: write
      id-token: write
    env:
      PROMPTLY_SIGN_RELEASE: 'true'
      PROMPTLY_PUBLISH_RELEASE: ${{ github.event_name == 'push' || inputs.publish }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Validate version and release ancestry
        run: node scripts/validate-release.mjs
      - name: Clean install
        run: npm ci
      - name: Check application
        run: npm run check
      - name: Authenticate signing identity with OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true
      - name: Prepare Windows signing tools
        shell: pwsh
        run: ./scripts/setup-signing.ps1
      - name: Build signed app and installer and verify payload signatures
        run: npm run make
      - name: Stage signed artifacts and checksums
        run: node scripts/stage-windows-artifacts.mjs --signed
      - name: Retain verified artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Promptly-signed-windows-x64-${{ github.sha }}
          path: out/staged/
          if-no-files-found: error
          retention-days: 14
      - name: Publish complete GitHub release
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.ps1
