name: Stage unsigned development installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Build unsigned installer
        run: npm run make
      - name: Stage artifacts and checksums
        run: npm run stage:unsigned
      - name: Retain development artifacts (no release publication)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Promptly-unsigned-development-windows-x64-${{ github.sha }}
          path: out/staged/
          if-no-files-found: error
          retention-days: 14
