name: Stage unsigned development installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out selected revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Build unsigned installer
        run: npm run make
      - name: Stage artifacts and checksums
        run: npm run stage:unsigned
      - name: Retain development artifacts (no release publication)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Promptly-unsigned-development-windows-x64-${{ github.sha }}
          path: out/staged/
          if-no-files-found: error
          retention-days: 14
